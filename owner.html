<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f5f3ee">
	<title>Owner | Definitely School Work</title>
	<link rel="icon" href="Images/favicon-512x512.png" type="image/svg+xml">
	<link rel="stylesheet" href="styles.css">
	<script src="owner.js" defer></script>
</head>
<body>
	<main class="app-shell">
		<header class="topbar owner-topbar">
			<a class="brand" href="index.html">Definitely School Work</a>
			<div class="owner-tools">
				<h1 class="owner-heading">Owner</h1>
				<button class="owner-hack-button" id="hack-toggle" type="button" aria-pressed="false">Hack</button>
			</div>
		</header>
		<section class="owner-content" aria-label="Owner controls">
			<p class="eyebrow">Owner area</p>
			<p class="owner-status" id="hack-status" aria-live="polite">Hack mode is off.</p>
			<nav class="owner-page-actions" aria-label="Owner page navigation">
				<a class="owner-action-button" href="index.html">Return to homepage <span aria-hidden="true">↗</span></a>
				<a class="owner-action-button secondary" href="index.html#work">Custom games <span aria-hidden="true">↗</span></a>
			</nav>
			<section class="owner-score-panel" id="score-panel" aria-labelledby="score-heading" hidden>
				<div class="owner-score-heading">
					<h2 id="score-heading">Game scores</h2>
					<p>Edit a saved best score.</p>
				</div>
				<div class="owner-score-list" id="score-list"></div>
			</section>
		</section>
	</main>
</body>
</html>
